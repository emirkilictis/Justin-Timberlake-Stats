name: Daily Streams Snapshot

on:
  # Her gece 00:05 UTC'de çalışır (Türkiye saatiyle 03:05)
  schedule:
    - cron: '5 0 * * *'
  # Manuel tetikleme (test için)
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js 24 kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Bağımlılıkları yükle
        run: npm install
        working-directory: scripts

      - name: Firestore snapshot al ve kaydet
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KWORB_DIRECT_URL: ${{ secrets.KWORB_DIRECT_URL }}
        run: node daily-snapshot.js
        working-directory: scripts

  sync-seo-figures:
    # EAS ve certified-units rakamları index.html/about.html/vault.html
    # içine statik metin olarak gömülü (AI crawler'lar JS çalıştırmaz).
    # Bu job canlı siteyi gerçek bir tarayıcıda açıp client-side JS'in
    # hesapladığı güncel sayıları okur ve <!--AUTO:X--> marker'larının
    # içini günceller — kaynak dosyalarda manuel rakam güncellemesi
    # gerektirmeden SEO metni taze kalır.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js 24 kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Bağımlılıkları yükle (Puppeteer/Chromium dahil)
        run: npm install
        working-directory: scripts

      - name: Canlı siteden EAS + certified units oku, dosyaları güncelle
        id: sync
        run: node sync-seo-figures.js
        working-directory: scripts

      # Google <changefreq>/<priority> etiketlerini yok sayıyor; tek dikkate aldığı
      # tazelik sinyali <lastmod>. Sync'ten SONRA çalışmalı ki değişen dosyalar
      # "bugün değişti" olarak işaretlensin.
      - name: sitemap.xml lastmod tarihlerini tazele
        run: node update-sitemap.js
        working-directory: scripts

      - name: Değişiklik varsa commit + push
        id: commit
        run: |
          if git diff --quiet -- index.html about.html vault.html llms.txt sitemap.xml; then
            echo "Değişiklik yok, commit atlanıyor."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "changed=true" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html about.html vault.html llms.txt sitemap.xml
          git commit -m "chore: sync EAS/certified-units SEO figures with live site [skip ci]"
          # --autostash şart: önceki adımdaki `npm install` scripts/package-lock.json'ı
          # değiştirebiliyor ve rebase "You have unstaged changes" ile düşüyor.
          git pull --rebase --autostash origin main
          git push

      # Commit mesajında [skip ci] olduğu için indexnow.yml push trigger'ı çalışmaz —
      # bu yüzden bildirimi buradan doğrudan gönderiyoruz.
      - name: Güncellenen sayfaları IndexNow'a bildir
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/indexnow-ping.js / /about.html /vault.html /llms.txt
